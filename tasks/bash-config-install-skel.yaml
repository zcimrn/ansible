- name: copy .bashrc
  become: true
  copy:
    src: ../files/.bashrc
    dest: /etc/skel/.bashrc
    mode: 0600

- name: copy .bash_profile
  become: true
  copy:
    src: ../files/.bash_profile
    dest: /etc/skel/.bash_profile
    mode: 0600

- name: copy .bash_logout
  become: true
  copy:
    src: ../files/.bash_logout
    dest: /etc/skel/.bash_logout
    mode: 0600

- name: remove .profile
  become: true
  file:
    path: /etc/skel/.profile
    state: absent
