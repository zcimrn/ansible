  - name: kitty uninstall
    hosts: all
    gather_facts: false
    become: true
    become_method: sudo
    tasks:
      - name: remove /opt/kitty
        file:
            path: /opt/kitty
            state: absent

      - name: remove /usr/local/bin/kitty
        file:
            path: /usr/local/bin/kitty
            state: absent

      - name: remove /usr/local/bin/kitten
        file:
            path: /usr/local/bin/kitten
            state: absent
